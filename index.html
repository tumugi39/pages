<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAParser.js クライアント分析</title>
    <!-- スタイル（見た目を少し綺麗に） -->
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h1 { font-size: 20px; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        p { margin: 10px 0; font-size: 16px; }
        span { font-weight: bold; color: #0076ff; }
        .loading { color: #888; font-style: italic; }
    </style>
    <!-- ① UAParser.js v2 の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js/dist/ua-parser.min.js"></script>
</head>
<body>

    <div class="card">
        <h1>💻 あなたの接続環境情報</h1>
        <div id="result" class="loading">解析中... (ブラウザへの権限確認含む)</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const parser = new UAParser();

            try {
                // ② Client Hints を用いて高精度な解析を実行（非同期）
                // これにより、Windows 11 などの正確なOSバージョンが取得できます
                const result = await parser.withClientHints();

                // 表示用HTMLの組み立て
                const output = `
                    <p>ブラウザ: <span>${result.browser.name || '不明'} (${result.browser.version || ''})</span></p>
                    <p>OS: <span>${result.os.name || '不明'} (${result.os.version || ''})</span></p>
                    <p>デバイス: <span>${result.device.vendor || ''} ${result.device.model || 'PC / デスクトップ'}</span></p>
                    <p>CPU型: <span>${result.cpu.architecture || '不明'}</span></p>
                `;

                document.getElementById('result').innerHTML = output;
                document.getElementById('result').classList.remove('loading');

            } catch (error) {
                // 万が一Client Hintsが拒否されたり失敗した場合のフォールバック（通常のUA判定）
                const result = parser.getResult();
                
                const output = `
                    <p>ブラウザ: <span>${result.browser.name || '不明'}</span></p>
                    <p>OS: <span>${result.os.name || '不明'}</span></p>
                    <p>(※高精度解析に失敗したため、通常モードで判定しました)</p>
                `;
                document.getElementById('result').innerHTML = output;
            }
        });
    </script>

</body>
</html>
